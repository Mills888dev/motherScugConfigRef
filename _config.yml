title: Motherscug config reference
description: Every fox setting of The Mother mod, and what it does.

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: dark
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 4
  preview_words_after: 8
  tokenizer_separator: /[\s\-/_]+/

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

exclude:
  - README.md
